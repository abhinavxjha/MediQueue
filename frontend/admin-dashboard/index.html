<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin & Hospital Console - Querly OPD</title>
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%2308707c'/><path d='M32 50 C32 50 10 36 10 22 C10 15 15 10 22 10 C26 10 30 13 32 16 C34 13 38 10 42 10 C49 10 54 15 54 22 C54 36 32 50 32 50Z' fill='white' opacity='0.15'/><polyline points='14,32 22,32 25,23 30,41 34,28 37,34 42,34 50,34' fill='none' stroke='white' stroke-width='4.5' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
  
  <!-- Shared Styles -->
  <link rel="stylesheet" href="../shared/css/base.css" />
  <link rel="stylesheet" href="../shared/css/layout.css" />
  
  <!-- Admin & Hospital Domain Styles -->
  <link rel="stylesheet" href="css/admin.css" />
  <link rel="stylesheet" href="css/hospital.css" />
</head>

<body>
  <div id="toast" class="toast-box"></div>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo-mark small"><i class="bi bi-shield-check"></i></div>
        <div>
          <b>Querly</b>
          <small>Admin & Hospital Desk</small>
        </div>
        <button type="button" class="sidebar-close-btn" onclick="closeSidebar()" aria-label="Close Navigation Menu">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <nav id="nav"></nav>

      <div class="emergency">
        <b>System Supervision</b>
        <span>OPD Control Desk</span>
        <strong>Station Alpha</strong>
      </div>

      <button class="logout" id="logout">
        <i class="bi bi-box-arrow-left"></i> Logout
      </button>
    </aside>

    <main class="main">
      <header>
        <button type="button" class="sidebar-toggle-btn" onclick="toggleSidebar()" aria-label="Open Navigation Menu">
          <i class="bi bi-list"></i>
        </button>

        <div class="search">
          <i class="bi bi-search"></i>
          <input placeholder="Filter records, doctors, patients..." id="globalSearch" />
        </div>


        <div class="header-actions">
          <button type="button" class="theme-toggle-btn" onclick="toggleTheme()" aria-label="Toggle Light/Dark Theme">
            <i class="bi bi-moon-stars-fill"></i>
          </button>
          <div class="profile" id="profileTrigger" title="Account Menu">
            <div class="avatar" id="avatar">A</div>
            <div>
              <b id="userName">Administrator</b>
              <small id="userRole">Hospital Admin</small>
            </div>
            <i class="bi bi-chevron-down ms-1"></i>
          </div>
        </div>
      </header>

      <div id="topAppointmentsBanner" class="top-appointments-banner"></div>

      <section id="content"></section>
    </main>
  </div>

  <!-- Shared Scripts -->
  <script src="../shared/js/utils.js"></script>
  <script src="../shared/js/api.js"></script>
  <script src="../shared/js/auth.js"></script>

  <!-- Admin & Hospital Domain Scripts -->
  <script src="js/hospital.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/doctors.js"></script>
  <script src="js/analytics.js"></script>
  <script src="js/appointments.js"></script>
  <script src="js/admin.js"></script>
</body>

</html>
